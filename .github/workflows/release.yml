name: Release

# Push a tag like v2.0.0 to build the Windows app and attach it to a GitHub
# Release. "Run workflow" on the Actions tab builds it without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Sidestick-windows
          path: dist/Sidestick-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Sidestick ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/Sidestick-windows.zip
