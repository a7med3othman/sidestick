[project]
name = "controller-companion"
version = "2.0.0"
description = "Use an Xbox controller as a mouse and keyboard on Windows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.5",
    "pynput>=1.7.6",
    "pystray>=0.19",
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
